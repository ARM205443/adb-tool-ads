<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>กำลังล้างเครื่อง</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%,#0b1a33 0%,#05070d 70%);
    color:#fff;font-family:'Segoe UI','Noto Sans Thai',sans-serif;text-align:center;
    padding:20px;overflow:hidden;position:relative;
    -webkit-user-select:none;user-select:none
  }
  body::before{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(0,150,255,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,150,255,.07) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)
  }
  .brand{position:relative;font-size:13px;letter-spacing:6px;color:#4db8ff;margin-bottom:26px;opacity:.9}

  .radar{
    position:relative;width:230px;height:230px;border-radius:50%;margin-bottom:34px;
    background:
      radial-gradient(circle,transparent 0 30%,rgba(0,150,255,.25) 30.5% 31%,transparent 31.5% 55%,
      rgba(0,150,255,.25) 55.5% 56%,transparent 56.5% 80%,rgba(0,150,255,.35) 80.5% 81%,transparent 81.5%),
      radial-gradient(circle,#071a33 0%,#040a14 100%);
    border:2px solid #0096ff;
    box-shadow:0 0 30px rgba(0,150,255,.55),inset 0 0 40px rgba(0,150,255,.25)
  }
  .radar::before,.radar::after{content:"";position:absolute;background:rgba(0,150,255,.25)}
  .radar::before{left:50%;top:0;bottom:0;width:1px}
  .radar::after{top:50%;left:0;right:0;height:1px}
  .sweep{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(0,190,255,.55) 0deg,rgba(0,190,255,0) 70deg,transparent 360deg);
    animation:spin 2.4s linear infinite
  }
  .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff3b5c;
       box-shadow:0 0 12px #ff3b5c;animation:blink 2.4s infinite}
  .d1{top:28%;left:62%;animation-delay:.3s}
  .d2{top:62%;left:30%;animation-delay:1.1s}
  .d3{top:70%;left:68%;animation-delay:1.8s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{0%,100%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2)}60%{opacity:.2}}

  h1{position:relative;font-size:clamp(28px,7vw,42px);font-weight:800;letter-spacing:1px;
     background:linear-gradient(90deg,#4db8ff,#fff,#4db8ff);-webkit-background-clip:text;
     background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
  .sub{position:relative;color:#9fb4d1;font-size:clamp(15px,4vw,18px);margin-bottom:26px}

  .bar{position:relative;width:min(340px,80vw);height:8px;border-radius:8px;background:#101a2c;
       overflow:hidden;margin-bottom:30px;border:1px solid #1b2c49}
  .bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:8px;
         background:linear-gradient(90deg,transparent,#0096ff,#4de1ff,transparent);
         animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{left:-40%}100%{left:100%}}

  .warn{
    position:relative;border:2px solid #ff3b5c;border-radius:16px;padding:16px 26px;
    background:rgba(255,59,92,.10);animation:pulse 1.6s ease-in-out infinite
  }
  .warn b{display:block;font-size:clamp(20px,5.5vw,26px);color:#ff5b78;letter-spacing:.5px}
  .warn span{display:block;margin-top:4px;font-size:clamp(13px,3.6vw,15px);color:#ffb3c0}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,59,92,0)}50%{box-shadow:0 0 28px rgba(255,59,92,.55)}}

  .foot{position:relative;margin-top:26px;font-size:12px;color:#5d7292;letter-spacing:1px}
  .typing::after{content:"";animation:dots 1.5s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
  <div class="brand">ADB TOOL • MALWARE CLEANER</div>

  <div class="radar">
    <div class="sweep"></div>
    <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
  </div>

  <h1>กำลังสแกนและล้างเครื่อง</h1>
  <div class="sub typing">กำลังกำจัดแอปอันตราย กรุณารอสักครู่</div>

  <div class="bar"><i></i></div>

  <div class="warn">
    <b>⚠ ห้ามถอดสาย USB</b>
    <span>รอจนกว่าช่างจะแจ้งว่าเสร็จสิ้น</span>
  </div>

  <div class="foot">PRODUCT OF THAILAND</div>
</body>
</html>
